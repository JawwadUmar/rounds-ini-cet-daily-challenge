<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7A2866" />
    <meta name="description" content="Prepare for INI-CET with daily clinical questions and a searchable library of 2020–2025 papers, figures and solutions." />
    <title>Rounds — INI-CET Daily Challenge</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        const theme = localStorage.getItem('rounds-inicet-theme-v1');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"><div class="initial-loading">Opening Rounds...</div></div>
    <noscript>This application needs JavaScript to select daily questions and save your progress in this browser.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
